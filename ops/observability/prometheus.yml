global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/insurance-alerts.yml

scrape_configs:
  - job_name: case-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["case-service:8081"]
  - job_name: integration-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["integration-service:8083"]
  - job_name: workflow-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["workflow-service:8082"]
  - job_name: web-bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["web-bff:8080"]
