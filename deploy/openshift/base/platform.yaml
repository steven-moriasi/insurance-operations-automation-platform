      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-web
  labels:
    app.kubernetes.io/name: operations-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: operations-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operations-web
    spec:
      serviceAccountName: operations-web
      containers:
        - name: operations-web
          image: ghcr.io/steven-moriasi/insurance-operations-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: operations-web
spec:
  selector:
    app.kubernetes.io/name: operations-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-worker
  labels:
    app.kubernetes.io/name: automation-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: automation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automation-worker
    spec:
      serviceAccountName: automation-worker
      containers:
        - name: automation-worker
          image: ghcr.io/steven-moriasi/insurance-automation-worker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: insurance-platform-config
          env:
            - name: INTEGRATION_SERVICE_URL
              value: http://integration-service:8083
            - name: OIDC_TOKEN_URL
              valueFrom:
                configMapKeyRef:
                  name: insurance-platform-config
                  key: OIDC_TOKEN_URI
            - name: AUTOMATION_WORKER_CLIENT_ID
              value: insurance-automation-worker
            - name: AUTOMATION_WORKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: automation-worker-client-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: insurance-operations
spec:
  to:
    kind: Service
    name: operations-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
