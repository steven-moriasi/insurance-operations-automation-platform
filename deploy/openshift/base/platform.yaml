apiVersion: v1
kind: ConfigMap
metadata:
  name: insurance-platform-config
data:
  OIDC_ISSUER_URI: https://identity.example.invalid/realms/insurance
  OIDC_AUTHORIZATION_URI: https://identity.example.invalid/realms/insurance/protocol/openid-connect/auth
  OIDC_TOKEN_URI: https://identity.example.invalid/realms/insurance/protocol/openid-connect/token
  OIDC_USER_INFO_URI: https://identity.example.invalid/realms/insurance/protocol/openid-connect/userinfo
  OIDC_JWK_SET_URI: https://identity.example.invalid/realms/insurance/protocol/openid-connect/certs
  CASE_SERVICE_BASE_URL: http://case-service:8081
  INTEGRATION_SERVICE_BASE_URL: http://integration-service:8083
  WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8082
  TEMPORAL_TARGET: temporal-frontend.temporal.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: insurance
  OBJECT_STORAGE_ENDPOINT: https://s3.af-south-1.amazonaws.com
  OBJECT_STORAGE_REGION: af-south-1
  OBJECT_STORAGE_BUCKET: replace-with-evidence-bucket
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: "0.1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: case-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: integration-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-bff
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operations-web
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: automation-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-service
  labels:
    app.kubernetes.io/name: case-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: case-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: case-service
    spec:
      serviceAccountName: case-service
      containers:
        - name: case-service
          image: ghcr.io/steven-moriasi/insurance-case-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: insurance-platform-config
          env:
            - name: CASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: case-database-url
            - name: CASE_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: case-database-username
            - name: CASE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: case-database-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: case-service
spec:
  selector:
    app.kubernetes.io/name: case-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  labels:
    app.kubernetes.io/name: integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: integration-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration-service
    spec:
      serviceAccountName: integration-service
      containers:
        - name: integration-service
          image: ghcr.io/steven-moriasi/insurance-integration-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: insurance-platform-config
          env:
            - name: INTEGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: integration-database-url
            - name: INTEGRATION_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: integration-database-username
            - name: INTEGRATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: integration-database-password
            - name: LEGACY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: legacy-database-url
            - name: LEGACY_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: legacy-database-username
            - name: LEGACY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: legacy-database-password
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: object-storage-access-key
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: object-storage-secret-key
            - name: PAYMENT_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: insurance-platform-secrets
                  key: payment-callback-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: integration-service
spec:
  selector:
    app.kubernetes.io/name: integration-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
