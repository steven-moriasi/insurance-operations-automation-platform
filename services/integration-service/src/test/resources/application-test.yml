spring:
  datasource:
    url: jdbc:h2:mem:integrations;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.example.test

insurance:
  object-storage:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: insurance-test-evidence
    access-key: test-access-key
    secret-key: test-secret-key
  payments:
    callback-secret: integration-test-callback-secret
  legacy:
    datasource:
      url: jdbc:h2:mem:legacy;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
