spring:
  application:
    name: insurance-integration-service
  datasource:
    url: ${INTEGRATION_DATABASE_URL:jdbc:postgresql://localhost:5432/insurance_integrations}
    username: ${INTEGRATION_DATABASE_USERNAME:insurance}
    password: ${INTEGRATION_DATABASE_PASSWORD:insurance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/insurance}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/insurance/protocol/openid-connect/certs}

server:
  port: ${INTEGRATION_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

insurance:
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:insurance-evidence}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
  payments:
    callback-secret: ${PAYMENT_CALLBACK_SECRET}
  security:
    client-id: ${INTEGRATION_API_OIDC_CLIENT_ID:insurance-integration-service}
  legacy:
    datasource:
      url: ${LEGACY_DATABASE_URL:jdbc:mysql://localhost:3306/legacy_policy}
      username: ${LEGACY_DATABASE_USERNAME:legacy_reader}
      password: ${LEGACY_DATABASE_PASSWORD:legacy_reader}
      driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
