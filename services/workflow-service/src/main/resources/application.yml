spring:
  application:
    name: insurance-workflow-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/insurance}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/insurance/protocol/openid-connect/certs}
      client:
        registration:
          case-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${WORKFLOW_OIDC_CLIENT_ID:insurance-workflow-service}
            client-secret: ${WORKFLOW_OIDC_CLIENT_SECRET}
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8080/realms/insurance/protocol/openid-connect/token}

server:
  port: ${WORKFLOW_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

insurance:
  security:
    client-id: ${WORKFLOW_API_OIDC_CLIENT_ID:insurance-workflow-service}
  services:
    case-service-base-url: ${CASE_SERVICE_BASE_URL:http://localhost:8081}
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    task-queue: ${TEMPORAL_CLAIMS_TASK_QUEUE:insurance-motor-claims}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
