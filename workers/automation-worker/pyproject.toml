[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-automation-worker"
version = "0.1.0"
description = "Bounded document and synthetic RPA activities for the insurance reference platform."
requires-python = ">=3.12"

[project.scripts]
insurance-automation-worker = "insurance_worker.main:main"

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
